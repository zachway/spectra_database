name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PostgreSQL and build q3c
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql build-essential git
          # postgresql-server-dev-all pulls in a postgresql-common version
          # that conflicts with the PGDG-repo postgresql-common GitHub's
          # runner images preinstall -- install the server-dev package for
          # whichever major version 'postgresql' actually resolved to instead.
          PG_MAJOR=$(psql --version | awk '{print $3}' | cut -d. -f1)
          sudo apt-get install -y "postgresql-server-dev-${PG_MAJOR}"
          # PGXS also wants the exact clang the installed Postgres was built
          # with (for the JIT bitcode side-build) -- without it, `make` fails
          # on dump.bc with "clang-19: No such file or directory".
          sudo apt-get install -y clang-19 || sudo apt-get install -y clang
          git clone --depth 1 https://github.com/segasai/q3c.git /tmp/q3c
          make -C /tmp/q3c
          sudo make -C /tmp/q3c install

      - name: Create test database
        run: |
          sudo systemctl start postgresql.service
          pg_isready --timeout=30
          sudo -u postgres psql -c "CREATE ROLE runner WITH LOGIN SUPERUSER PASSWORD 'runner';"
          sudo -u postgres createdb -O runner spectra_test
          PGPASSWORD=runner psql -h localhost -U runner -d spectra_test -f db/schema.sql

      - name: Install Python dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        env:
          DATABASE_URL: postgresql://runner:runner@localhost/spectra_test
        run: python -m pytest tests/ -v
